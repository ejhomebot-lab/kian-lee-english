<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Soft Apple — Kian Lee English</title>
<style>

  :root {
    --bg:#f7f0ea; --card:#fffcfa; --ink:#4a3f45; --soft:#c47a8a;
    --accent:#e8cfc4; --prompt:#6a8f7c; --prompt-bg:#eaf5ef;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:radial-gradient(ellipse at top,#fff8f3 0%,var(--bg) 70%); color:var(--ink);
    font-family:"Segoe UI","PingFang HK","Noto Sans TC",system-ui,sans-serif; overflow:hidden; user-select:none; }
  .back-home { position:fixed; top:0.65rem; left:0.65rem; z-index:30; text-decoration:none; background:#fff8f3; color:var(--ink);
    padding:0.4rem 0.75rem; border-radius:999px; font-size:0.85rem; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .voice-bar { position:fixed; top:0.45rem; right:0.45rem; left:auto; z-index:30; display:flex; gap:0.35rem; flex-wrap:wrap; justify-content:flex-end; align-items:center; max-width:min(78%, 34rem); }
  .voice-bar button, .voice-bar .chip, .voice-bar .speed-group button {
    border:none; border-radius:999px; padding:0.48rem 0.78rem; font-size:0.8rem; font-weight:700; cursor:pointer;
    background:#efe4dc; color:var(--ink); min-height:2.35rem; -webkit-tap-highlight-color:transparent;
  }
  .voice-bar button.on { background:var(--soft); color:#fff; }
  .voice-bar .play { background:var(--accent); }
  .voice-bar .auto.on { background:#6a8f7c; color:#fff; }
  .voice-bar .speed-group { display:inline-flex; gap:0.2rem; background:#f3ebe4; border-radius:999px; padding:0.15rem; }
  .voice-bar .speed-group button { padding:0.4rem 0.55rem; font-size:0.72rem; background:transparent; min-height:2.1rem; }
  .voice-bar .speed-group button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .voice-bar .speed-label { font-size:0.7rem; font-weight:700; color:#9a8a90; padding:0 0.15rem; }
  .done-banner { display:none; position:fixed; left:50%; bottom:5.2rem; transform:translateX(-50%); z-index:25;
    background:#fff8f3; color:var(--ink); border:2px solid var(--accent); border-radius:999px; padding:0.55rem 1.1rem;
    font-size:0.95rem; font-weight:700; box-shadow:0 6px 20px rgba(74,63,69,.1); white-space:nowrap; }
  .done-banner.show { display:block; }
  #deck { height:100%; width:100%; display:flex; align-items:center; justify-content:center; padding:4.4rem 1rem 4.6rem; cursor:pointer; }
  .slide { display:none; width:min(960px,100%); background:var(--card); border-radius:28px; box-shadow:0 18px 50px rgba(74,63,69,.09);
    padding:1.1rem 1.1rem 1.5rem; flex-direction:column; align-items:center; text-align:center; gap:0.85rem; }
  .slide.active { display:flex; }
  .art { width:100%; border-radius:20px; overflow:hidden; background:#f3ebe4; aspect-ratio:16/9; }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .line { font-size:clamp(1.7rem,5.2vw,2.7rem); font-weight:650; line-height:1.3; }
  .prompt { margin-top:0.1rem; padding:0.85rem 1.1rem; border-radius:18px; background:var(--prompt-bg); border:2px dashed var(--prompt);
    color:var(--prompt); font-size:clamp(1rem,3.2vw,1.35rem); font-weight:600; max-width:32rem; line-height:1.4; }
  .prompt::before { content:"♡ "; }
  .nav { position:fixed; bottom:2.4rem; left:0; right:0; display:flex; justify-content:center; gap:1rem; pointer-events:none; }
  .nav button { pointer-events:auto; border:none; background:var(--accent); color:var(--ink); font-size:1.35rem; font-weight:700;
    width:3.1rem; height:3.1rem; border-radius:999px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .dots { position:fixed; top:4.05rem; left:0; right:0; display:flex; justify-content:center; gap:0.35rem; flex-wrap:wrap; padding:0 1rem; }
  .dot { width:8px; height:8px; border-radius:50%; background:#dfd0c8; }
  .dot.on { background:#c48b8b; }
  .hint { position:fixed; bottom:0.75rem; left:0; right:0; text-align:center; font-size:0.8rem; color:#a09096; pointer-events:none; }

</style>
</head>

  <p class="hint">iPad：撳「自動播放」開始 · 可調速度 · 英式／美式女聲</p>
<script>

(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var dots = document.getElementById('dots');
  var doneBanner = document.getElementById('done-banner');
  var autoBtn = document.getElementById('autoplay');
  var i = 0;
  var accent = 'uk'; // uk | us
  var rate = 0.85;
  var autoplay = false;
  var voices = [];
  var prefer = { uk: [], us: [] };
  var speakToken = 0;
  var fallbackTimer = null;
  var keepAliveTimer = null;
  var STORAGE_RATE = 'softmoon-rate';
  var STORAGE_ACCENT = 'softmoon-accent';

  try {
    var savedRate = parseFloat(localStorage.getItem(STORAGE_RATE) || '');
    if (savedRate === 0.7 || savedRate === 0.85 || savedRate === 1) rate = savedRate;
    var savedAccent = localStorage.getItem(STORAGE_ACCENT);
    if (savedAccent === 'uk' || savedAccent === 'us') accent = savedAccent;
  } catch (e) {}

  slides.forEach(function(){ var d=document.createElement('span'); d.className='dot'; dots.appendChild(d); });

  function syncSpeedUI(){
    ['spd-slow','spd-norm','spd-fast'].forEach(function(id){
      var el = document.getElementById(id);
      var r = parseFloat(el.getAttribute('data-rate'));
      el.classList.toggle('on', r === rate);
    });
  }
  function syncAccentUI(){
    document.getElementById('v-uk').classList.toggle('on', accent==='uk');
    document.getElementById('v-us').classList.toggle('on', accent==='us');
  }
  function syncAutoUI(){
    autoBtn.classList.toggle('on', autoplay);
    autoBtn.setAttribute('aria-pressed', autoplay ? 'true' : 'false');
    autoBtn.textContent = autoplay ? '⏸ 停止播放' : '▶ 自動播放';
  }
  syncSpeedUI();
  syncAccentUI();

  function loadVoices(){
    voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    prefer.uk = []; prefer.us = [];
    voices.forEach(function(v){
      var n = (v.name||'') + ' ' + (v.lang||'');
      var femaleHint = /female|woman|samantha|karen|moira|tessa|veena|fiona|serena|zira|susan|hazel|martha|google uk english female|google us english female/i.test(n);
      var maleHint = /male|david|daniel|james|fred|alex(?!a)/i.test(n) && !/female/i.test(n);
      if (/^en-GB/i.test(v.lang) || /British|UK English|en_GB/i.test(n)) {
        prefer.uk.push({v:v, score:(femaleHint?2:0)+(maleHint?-2:0)+(/Google|Microsoft|Samantha|Serena|Hazel/i.test(n)?1:0)});
      }
      if (/^en-US/i.test(v.lang) || /US English|American|en_US/i.test(n)) {
        prefer.us.push({v:v, score:(femaleHint?2:0)+(maleHint?-2:0)+(/Google|Microsoft|Samantha|Zira|Susan/i.test(n)?1:0)});
      }
    });
    prefer.uk.sort(function(a,b){return b.score-a.score});
    prefer.us.sort(function(a,b){return b.score-a.score});
  }
  if (window.speechSynthesis) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }


  var iosUnlocked = false;
  var unlockTimer = null;

  function showSpeechToast(msg){
    var el = document.getElementById('speech-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'speech-toast';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;left:50%;bottom:18%;transform:translateX(-50%);z-index:9999;max-width:88%;padding:10px 14px;border-radius:12px;background:rgba(40,28,20,.92);color:#fff;font-size:14px;line-height:1.4;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .25s';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(el._hide);
    el._hide = setTimeout(function(){ el.style.opacity = '0'; }, 4200);
  }

  function pickVoice(){
    var list = accent==='uk' ? prefer.uk : prefer.us;
    // iOS preferred names first (Samantha US; Karen/Moira UK; Daniel UK male fallback)
    var iosNames = accent==='uk'
      ? [/karen/i, /moira/i, /serena/i, /daniel/i, /martha/i]
      : [/samantha/i, /susan/i, /zira/i, /karen/i];
    for (var n = 0; n < iosNames.length; n++) {
      for (var k = 0; k < voices.length; k++) {
        if (iosNames[n].test(voices[k].name || '') && /^en/i.test(voices[k].lang || '')) {
          return voices[k];
        }
      }
    }
    if (list.length) return list[0].v;
    for (var k2 = 0; k2 < voices.length; k2++){
      if (/^en/i.test(voices[k2].lang)) return voices[k2];
    }
    return null;
  }

  function clearTimers(){
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
    if (unlockTimer) { clearTimeout(unlockTimer); unlockTimer = null; }
  }

  function cancelSpeech(){
    speakToken++;
    clearTimers();
    if (window.speechSynthesis) {
      try { speechSynthesis.cancel(); } catch (e) {}
    }
  }

  // iOS Safari: first speak must be inside a user gesture; unlock with a near-empty utterance.
  function unlockSpeech(then){
    if (iosUnlocked) { if (then) then(); return; }
    if (!window.speechSynthesis) {
      showSpeechToast('呢個瀏覽器唔支援朗讀。請用 Safari 開，並關靜音掣。');
      if (then) then();
      return;
    }
    var done = false;
    function finishUnlock(){
      if (done) return;
      done = true;
      iosUnlocked = true;
      if (then) then();
    }
    try {
      var u0 = new SpeechSynthesisUtterance(' ');
      u0.volume = 0.01;
      u0.rate = 1;
      u0.lang = accent==='uk' ? 'en-GB' : 'en-US';
      var v0 = pickVoice();
      if (v0) u0.voice = v0;
      u0.onend = u0.onerror = function(){ finishUnlock(); };
      speechSynthesis.speak(u0);
      if (speechSynthesis.paused) speechSynthesis.resume();
      // if onend never fires, still proceed
      setTimeout(finishUnlock, 120);
    } catch (e) {
      finishUnlock();
    }
  }

  function speakText(text, onDone){
    if (!text) { if (onDone) onDone(false); return; }
    if (!window.speechSynthesis) {
      showSpeechToast('呢個瀏覽器唔支援朗讀。請用 Safari 開；微信／WhatsApp 內置瀏覽器可能無聲。');
      if (onDone) onDone(false);
      return;
    }
    cancelSpeech();
    var myToken = speakToken;
    var finished = false;
    function finish(ok){
      if (finished || myToken !== speakToken) return;
      finished = true;
      clearTimers();
      if (onDone) onDone(ok);
    }
    // Critical on iOS: delay after cancel before speak (~50–100ms)
    unlockTimer = setTimeout(function(){
      if (myToken !== speakToken) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = accent==='uk' ? 'en-GB' : 'en-US';
      u.rate = rate;
      u.pitch = 1.05;
      var v = pickVoice();
      if (v) u.voice = v;
      u.onend = function(){ finish(true); };
      u.onerror = function(){ finish(false); };
      // iOS often pauses mid-utterance; resume every ~8s
      keepAliveTimer = setInterval(function(){
        if (myToken !== speakToken) return;
        try {
          if (speechSynthesis.paused) speechSynthesis.resume();
          else speechSynthesis.resume();
        } catch (e) {}
      }, 8000);
      var estMs = Math.max(2200, Math.min(14000, text.split(/\s+/).length * (1100 / Math.max(rate, 0.5)) + 900));
      fallbackTimer = setTimeout(function(){ finish(false); }, estMs);
      try {
        speechSynthesis.speak(u);
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (e) {
        finish(false);
      }
    }, 60);
  }


  function hideDone(){ doneBanner.classList.remove('show'); }

  function showDone(){
    doneBanner.classList.add('show');
    setTimeout(function(){ doneBanner.classList.remove('show'); }, 3200);
  }

  function speakSlide(then){
    var s = slides[i];
    var main = s.getAttribute('data-speak') || '';
    var pr = s.getAttribute('data-prompt-speak') || '';
    speakText(main + (pr ? '. ' + pr : ''), then);
  }

  function show(n, opts){
    opts = opts || {};
    if (n<0) n=0; if (n>=slides.length) n=slides.length-1;
    i=n;
    hideDone();
    slides.forEach(function(s,k){ s.classList.toggle('active', k===i); });
    Array.prototype.forEach.call(dots.children, function(d,k){ d.classList.toggle('on', k===i); });
    if (opts.silent) return;
    if (autoplay) {
      speakSlide(function(){
        if (!autoplay) return;
        if (i >= slides.length - 1) {
          stopAutoplay(true);
          return;
        }
        setTimeout(function(){
          if (!autoplay) return;
          show(i+1, { fromAuto: true });
        }, 450);
      });
    } else if (!opts.skipSpeak) {
      speakSlide();
    }
  }

  function stopAutoplay(atEnd){
    autoplay = false;
    syncAutoUI();
    cancelSpeech();
    if (atEnd) showDone();
  }

  function startAutoplay(){
    autoplay = true;
    syncAutoUI();
    hideDone();
    // User gesture: unlock iOS speech first, then speak chain
    unlockSpeech(function(){
      speakSlide(function(){
        if (!autoplay) return;
        if (i >= slides.length - 1) {
          stopAutoplay(true);
          return;
        }
        setTimeout(function(){
          if (!autoplay) return;
          show(i+1, { fromAuto: true });
        }, 450);
      });
    });
  }

  show(0, { skipSpeak: true });

  // Tip for in-app browsers (WeChat / WhatsApp) where TTS is often blocked
  try {
    var ua = navigator.userAgent || '';
    if (/MicroMessenger|WhatsApp|FBAN|FBAV|Line\//i.test(ua)) {
      setTimeout(function(){
        showSpeechToast('請用 Safari 開啟本頁先會有聲（微信／WhatsApp 內置瀏覽器通常無聲）。');
      }, 600);
    }
  } catch (e) {}


  function next(){
    if (i >= slides.length - 1) {
      if (autoplay) stopAutoplay(true);
      return;
    }
    show(i+1);
  }
  function prev(){
    if (i <= 0) return;
    show(i-1);
  }

  document.getElementById('deck').addEventListener('click', function(e){
    if (e.target.closest('button,a,.voice-bar,#done-banner')) return;
    next();
  });
  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
  document.getElementById('speak-now').addEventListener('click', function(e){
    e.stopPropagation();
    if (autoplay) stopAutoplay(false);
    unlockSpeech(function(){ speakSlide(); });
  });
  autoBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (autoplay) {
      stopAutoplay(false);
    } else {
      startAutoplay();
    }
  });
  document.getElementById('v-uk').addEventListener('click', function(e){
    e.stopPropagation(); accent='uk'; syncAccentUI();
    try { localStorage.setItem(STORAGE_ACCENT, accent); } catch (err) {}
    unlockSpeech(function(){ if (autoplay) { startAutoplay(); } else { speakSlide(); } });
  });
  document.getElementById('v-us').addEventListener('click', function(e){
    e.stopPropagation(); accent='us'; syncAccentUI();
    try { localStorage.setItem(STORAGE_ACCENT, accent); } catch (err) {}
    unlockSpeech(function(){ if (autoplay) { startAutoplay(); } else { speakSlide(); } });
  });
  ['spd-slow','spd-norm','spd-fast'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(e){
      e.stopPropagation();
      rate = parseFloat(this.getAttribute('data-rate'));
      syncSpeedUI();
      try { localStorage.setItem(STORAGE_RATE, String(rate)); } catch (err) {}
      unlockSpeech(function(){ if (autoplay) { startAutoplay(); } else { speakSlide(); } });
    });
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if (e.key==='Escape'||e.key==='Home'){ e.preventDefault(); if (autoplay) stopAutoplay(false); show(0); }
  });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && autoplay) stopAutoplay(false);
  });
})();

</script>
</body>
</html>
